# TurboJedi, Turbo Journald Interface
# https://github.com/cyanide-burnout/TurboJedi
# Artem Prilutskiy, 2026

# Packages for Debian, Ubuntu, Fedora, RHEL, Amazon Linux and openSUSE on amd64 and arm64 and for Arch Linux on amd64,
# each built natively in a container of its distribution; a tag v* puts them all to its release

name: Packages

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  package:
    name: ${{ matrix.distro.name }} ${{ matrix.arch }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    container: ${{ matrix.distro.image }}

    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        distro:
          - { name: debian-12,    image: 'debian:12' }
          - { name: debian-13,    image: 'debian:13' }
          - { name: ubuntu-22.04, image: 'ubuntu:22.04' }
          - { name: ubuntu-24.04, image: 'ubuntu:24.04' }
          - { name: ubuntu-26.04, image: 'ubuntu:26.04' }
          - { name: fedora-44,    image: 'fedora:44' }
          - { name: el9,          image: 'almalinux:9' }
          - { name: el10,         image: 'almalinux:10' }
          - { name: amzn2023,     image: 'amazonlinux:2023' }
          # openSUSE gives no tag of its own, the name goes to the packages instead
          - { name: tumbleweed,   image: 'opensuse/tumbleweed' }
          - { name: leap16,       image: 'opensuse/leap:16.0' }
        include:
          # Arch Linux is there for x86_64 only, Arch Linux ARM is a project of its own
          - { arch: amd64, distro: { name: archlinux, image: 'archlinux:latest' } }

    steps:
      - name: Git
        # Without git in the container the checkout comes without history and submodules
        run: |
          if command -v apt-get > /dev/null; then apt-get update -q && apt-get install -y -q --no-install-recommends git ca-certificates;
          elif command -v pacman > /dev/null; then pacman -Sy --noconfirm --needed git;
          elif command -v zypper > /dev/null; then zypper -n -q install git;
          else dnf install -y -q git; fi

      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0

      - name: Build
        run: sh .github/package.sh ${{ matrix.distro.name }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.distro.name }}-${{ matrix.arch }}
          path: dist/*

  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      # Only the notes of the release are needed, before the packages since checkout cleans the directory
      - uses: actions/checkout@v7
        with:
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # The section of CHANGELOG.md for the version goes in front of the link to the full changelog, a version
          # without one gets the link alone. Versions are compared as strings, 0.1 is not 0.10; the wrapped lines of
          # an item are joined, GitHub breaks a release text where its lines break
          awk -v version="${TAG#v}" '
            /^## /      { found = (($2 "") == version); next }
            !found      { next }
            /^  +[^ -]/ { sub(/^ +/, " "); text = text $0; next }
            count ++    { print text }
                        { text = $0 }
            END         { if (count) print text }' CHANGELOG.md > notes.md
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "TurboJedi ${TAG#v}" --notes-file notes.md --generate-notes
          gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
