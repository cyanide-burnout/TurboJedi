# TurboJedi, Turbo Journald Interface
# https://github.com/cyanide-burnout/TurboJedi
# Artem Prilutskiy, 2026

# Packages for Debian, Ubuntu, Fedora and RHEL on amd64 and arm64, each built natively in a container of its distribution;
# a tag v* puts them all to its release

name: Packages

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  package:
    name: ${{ matrix.distro.name }} ${{ matrix.arch }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    container: ${{ matrix.distro.image }}

    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        distro:
          - { name: debian-13,    image: 'debian:13' }
          - { name: ubuntu-24.04, image: 'ubuntu:24.04' }
          - { name: ubuntu-26.04, image: 'ubuntu:26.04' }
          - { name: fedora-44,    image: 'fedora:44' }
          - { name: el9,          image: 'almalinux:9' }
          - { name: el10,         image: 'almalinux:10' }

    steps:
      - name: Git
        # Without git in the container the checkout comes without history and submodules
        run: |
          if command -v apt-get > /dev/null; then apt-get update -q && apt-get install -y -q --no-install-recommends git ca-certificates; else dnf install -y -q git; fi

      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Build
        run: sh .github/package.sh ${{ matrix.distro.name }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.distro.name }}-${{ matrix.arch }}
          path: dist/*

  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "TurboJedi ${TAG#v}" --generate-notes
          gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
