<?xml version="1.0"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">

<!-- TurboJedi, Turbo Journald Interface, https://github.com/cyanide-burnout/TurboJedi

     Every instance of TurboJedi takes a name me.burnaway.TurboJedi.U<uid>.P<pid> on the system bus and answers calls of
     its own user and root there, see DBUS.md. The bus lets anyone take a name of the prefix and call it; who may do what
     is decided by TurboJedi itself by the UID the bus tells. Without this file TurboJedi works as before, without the
     interface -->

<busconfig>
  <policy context="default">
    <allow own_prefix="me.burnaway.TurboJedi"/>
    <allow send_destination_prefix="me.burnaway.TurboJedi" send_interface="me.burnaway.TurboJedi"/>
    <allow send_destination_prefix="me.burnaway.TurboJedi" send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination_prefix="me.burnaway.TurboJedi" send_interface="org.freedesktop.DBus.Peer"/>
  </policy>
</busconfig>
