<?xml version="1.0"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">

<!-- TurboJedi, Turbo Journald Interface, https://github.com/cyanide-burnout/TurboJedi

     me.burnaway.TurboJedi.conf for D-Bus before 1.13.12, of Ubuntu 22.04 for one, which knows no send_destination_prefix
     and refuses a file that has it. The calls go by the interface of TurboJedi alone, which no other service has;
     introspection and ping of its names are left out, they could not be told from the ones of other services here. The
     Makefile installs this one under the name of the other where dbus-daemon is older, see DBUS.md -->

<busconfig>
  <policy context="default">
    <allow own_prefix="me.burnaway.TurboJedi"/>
    <allow send_interface="me.burnaway.TurboJedi"/>
  </policy>
</busconfig>
